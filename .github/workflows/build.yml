name: Build SKELL SPECTRE Windows VST3
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  dsp-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure DSP regression with Clang sanitizers
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build-dsp
          -DSKELL_BUILD_PLUGIN=OFF -DSKELL_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer -D_GLIBCXX_ASSERTIONS'
          -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
      - name: Build DSP tests
        run: cmake --build build-dsp --parallel 2
      - name: Run DSP regressions
        run: ctest --test-dir build-dsp --output-on-failure

  build:
    needs: dsp-sanitizers
    runs-on: windows-latest
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      CI_CHECKOUT_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure JUCE 8 and x64 targets
        run: cmake -S . -B build -A x64 -DSKELL_BUILD_TESTS=ON
      - name: Build plugin and DSP tests
        run: cmake --build build --config Release --parallel 2
      - name: Run DSP regressions
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Test release packaging verifier
        run: python -m unittest discover -s tests -p "test_release_packaging.py" -v
      - name: Stage and verify Windows VST3 preview
        shell: pwsh
        run: |
          $packageArgs = @(
            'tools/package_windows_vst3.py',
            '--repo-root', $env:GITHUB_WORKSPACE,
            '--build-root', 'build/SkellSpectre_artefacts',
            '--output-dir', 'release-stage',
            '--source-commit', $env:SOURCE_COMMIT,
            '--ci-checkout-commit', $env:CI_CHECKOUT_COMMIT,
            '--ref-name', $env:GITHUB_REF_NAME,
            '--run-id', $env:GITHUB_RUN_ID
          )
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $packageArgs += '--require-commercial-metadata' }
          python @packageArgs
          if ($LASTEXITCODE -ne 0) { throw "VST3 staging failed with exit code $LASTEXITCODE" }
      - name: Validate staged Windows VST3 with pluginval 1.0.4
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem -Path release-stage -Directory -Recurse -Filter '*.vst3')
          if ($bundles.Count -ne 1) { throw "Expected exactly one staged VST3 bundle, found $($bundles.Count)" }
          $zip = Join-Path $env:RUNNER_TEMP 'pluginval_Windows.zip'
          $pluginvalDir = Join-Path $env:RUNNER_TEMP 'pluginval'
          $expectedHash = 'c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab'
          Invoke-WebRequest -Uri 'https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip' -OutFile $zip
          $actualHash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
          if ($actualHash -ne $expectedHash) { throw "pluginval archive SHA-256 mismatch: expected $expectedHash, got $actualHash" }
          Expand-Archive -Path $zip -DestinationPath $pluginvalDir -Force
          $pluginval = Get-ChildItem -Path $pluginvalDir -Recurse -File -Filter 'pluginval.exe' | Select-Object -First 1
          if (-not $pluginval) { throw 'pluginval.exe missing from pinned v1.0.4 archive' }
          $pluginPath = $bundles[0].FullName
          $arguments = '--strictness-level 5 --validate-in-process --skip-gui-tests "' + $pluginPath + '"'
          $validation = Start-Process -FilePath $pluginval.FullName -ArgumentList $arguments -Wait -PassThru -NoNewWindow
          if ($null -eq $validation.ExitCode -or $validation.ExitCode -ne 0) {
            throw "pluginval failed with exit code $($validation.ExitCode)"
          }
      - name: Record strictness-5 pluginval pass and refresh package checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Resolve-Path release-stage).Path
          $manifestPath = Join-Path $root 'BUILD-MANIFEST.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json -AsHashtable -ErrorAction Stop
          $manifest.pluginval = @{ version = '1.0.4'; strictness_level = 5; result = 'passed' }
          [IO.File]::WriteAllText($manifestPath, (ConvertTo-Json -InputObject $manifest -Depth 12) + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))
          $checksumPath = Join-Path $root 'SHA256SUMS.txt'
          $lines = [System.Collections.Generic.List[string]]::new()
          foreach ($file in (Get-ChildItem -LiteralPath $root -File -Recurse -Force |
              Where-Object { -not [string]::Equals($_.FullName, $checksumPath, [StringComparison]::OrdinalIgnoreCase) } |
              Sort-Object -Property FullName)) {
            $relative = [IO.Path]::GetRelativePath($root, $file.FullName).Replace('\', '/')
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines.Add("$hash  $relative")
          }
          [IO.File]::WriteAllLines($checksumPath, $lines, [Text.UTF8Encoding]::new($false))
      - name: Test private-preview install, update and rollback
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/test_installer.ps1 -InstallerPath release-stage/Install-SKELL-SPECTRE-Preview.ps1 -PackageRoot release-stage
      - name: Upload verified Windows VST3 preview
        uses: actions/upload-artifact@v4
        with:
          name: SKELL-SPECTRE-Windows-VST3
          path: release-stage/**
          if-no-files-found: error
          retention-days: 14
